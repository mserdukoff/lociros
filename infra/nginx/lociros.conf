# Lociros API: nginx in front of the API replicas on this box.
# Installed to /etc/nginx/conf.d/lociros.conf by infra/nginx-setup.sh, which
# replaces __DOMAIN__. certbot adds the 443 listener and the HTTP->HTTPS redirect.
#
# Generated includes (never edit by hand):
#   /etc/nginx/lociros/upstream.conf    API replicas, rewritten by scripts/lightsail-run.sh
#   /etc/nginx/lociros/client-key.conf  map of the visitor address, built from PROXY_SECRET

# The PROXY_SECRET map key is 64 characters; the default bucket (64) is too small.
map_hash_bucket_size 128;

include /etc/nginx/lociros/upstream.conf;
include /etc/nginx/lociros/client-key.conf;

# Browser traffic reaches us through Vercel's few egress addresses, so limits
# key on $lociros_client (the visitor address the proxy vouches for with
# PROXY_SECRET), falling back to the peer address for anything else.
# These are a coarse flood guard; per-route limits live in the API.
limit_req_zone $lociros_client zone=lociros_req:20m rate=30r/s;
limit_conn_zone $lociros_client zone=lociros_conn:10m;
# Ceiling on all traffic from one peer (one Vercel address carries many visitors).
limit_conn_zone $binary_remote_addr zone=lociros_peer:10m;
limit_req_status 429;
limit_conn_status 429;

log_format lociros '$remote_addr client=$lociros_client [$time_local] "$request" '
                   '$status $body_bytes_sent rt=$request_time '
                   'up=$upstream_addr ust=$upstream_status urt=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/lociros.access.log lociros;
    error_log /var/log/nginx/lociros.error.log warn;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replicas are on localhost: a connect that takes longer means it is gone.
    proxy_connect_timeout 1s;
    proxy_send_timeout 120s;
    # Translation and custom-passage polling can hold a request for a while.
    proxy_read_timeout 120s;
    # A replica that refuses or drops a connection is skipped. POSTs are only
    # retried when nginx never got to send them, so writes are not repeated.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_busy_buffers_size 32k;

    location = /health {
        access_log off;
        proxy_pass http://lociros_api;
    }

    # Stripe retries webhooks itself and its addresses are shared; do not throttle them.
    location = /api/billing/webhook {
        proxy_pass http://lociros_api;
    }

    location / {
        limit_req zone=lociros_req burst=60 nodelay;
        limit_conn lociros_conn 40;
        limit_conn lociros_peer 1000;
        proxy_pass http://lociros_api;
    }
}
