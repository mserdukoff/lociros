services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: levla
      POSTGRES_PASSWORD: levla
      POSTGRES_DB: levla
    ports:
      - "5432:5432"
    volumes:
      - levla-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levla -d levla"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - levla-audio:/app/backend/audio
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://levla:levla@postgres:5432/levla
      AUDIO_DIR: /app/backend/audio
      GENERATE_WORKERS: 2
      NEWS_SCHEDULER: "true"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: []
    command: ["python", "-m", "app.worker"]
    env_file:
      - backend/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://levla:levla@postgres:5432/levla
      GENERATE_WORKERS: 4
      SKIP_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NLP_BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  levla-pg:
  levla-audio:
